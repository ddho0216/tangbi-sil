<title>초호화 탕비실</title>
<style>
  /* 건의사항 글씨체: 나눔손글씨 고딕 아니고 고딩 (글자 일부만 담아 줄인 파일) */
  @font-face { font-family: 'GoDing'; src: url(data:font/woff2;base64,__NOTE_FONT_B64__) format('woff2'); font-display: swap; }
  /* 레이아웃: 전체 화면 3D 탕비실. 물건을 누르면 가운데에 작은 앱 창이 열린다 */
  :root {
    --bg: #e4d9c4;
    --ink: #2b2620;
    --paper: #fbf6ea;
    --field: #ffffff;
    --muted: #6d6455;
    --line: #d9cdb4;
    --accent: #2f7f79;
    --accent-ink: #ffffff;
    --warn: #b5461f;
    --warn-bg: #fbe3d6;
    --ok-bg: #d6ead4;
    --bad: #c0392b;
    --bad-bg: #fbe3df;
    --scrim: rgba(43, 38, 32, .45);
    --toast-bg: #2b2620;
    --toast-ink: #ffffff;
    --font: "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1a16; --ink: #f1eadb; --paper: #2a2620; --field: #1a1713; --muted: #b2a791;
      --line: #4a4236; --accent: #55b3ab; --accent-ink: #10201f; --warn: #ffa27a; --warn-bg: #4d2a1c;
      --ok-bg: #26422a; --bad: #ff8b7d; --bad-bg: #4a2420; --scrim: rgba(0, 0, 0, .6);
      --toast-bg: #f1eadb; --toast-ink: #2b2620; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1a16; --ink: #f1eadb; --paper: #2a2620; --field: #1a1713; --muted: #b2a791;
    --line: #4a4236; --accent: #55b3ab; --accent-ink: #10201f; --warn: #ffa27a; --warn-bg: #4d2a1c;
    --ok-bg: #26422a; --bad: #ff8b7d; --bad-bg: #4a2420; --scrim: rgba(0, 0, 0, .6);
    --toast-bg: #f1eadb; --toast-ink: #2b2620; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }

  #hint {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 32px); padding: 10px 14px; background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; font-size: 14px; line-height: 1.5;
  }
  #hud {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px));
    max-width: 240px; padding: 8px 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; line-height: 1.5; z-index: 6;
  }
  #hud b { font-size: 16px; font-variant-numeric: tabular-nums; }
  #hud b.low { color: var(--warn); }
  #hud button { margin-top: 6px; padding: 3px 9px; font-size: 12px; }
  #hud .tasks { color: var(--muted); font-size: 12px; }
  #ramenhud {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px));
    display: none; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px);
    padding: 8px 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; z-index: 6; font-size: 14px;
  }
  #ramenhud b { font-variant-numeric: tabular-nums; }
  #fpsbtn {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); z-index: 7;
    padding: 8px 14px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font-size: 14px;
  }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid rgba(255,255,255,.9);
    border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; display: none; z-index: 4; }
  #dpad { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 90px; z-index: 7; display: none;
    grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; touch-action: none; }
  #dpad button { padding: 0; font-size: 15px; touch-action: none; user-select: none; background: var(--paper); }
  #dpad button[data-k="w"] { grid-column: 2; grid-row: 1; } #dpad button[data-k="a"] { grid-column: 1; grid-row: 2; }
  #dpad button[data-k="s"] { grid-column: 2; grid-row: 2; } #dpad button[data-k="d"] { grid-column: 3; grid-row: 2; }
  #ibar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px));
    display: none; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px);
    padding: 8px 12px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; z-index: 8; font-size: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  #ibar .ititle { margin-right: 2px; }
  #ibar .iinfo { color: var(--muted); font-size: 12px; max-width: 280px; line-height: 1.35; }
  #ibar input[type=text] { width: 190px; padding: 7px 10px; }
  #ibar .seg { margin: 0; }
  #ibar button { padding: 7px 12px; }
  #label {
    position: fixed; pointer-events: none; padding: 4px 10px; border-radius: 6px;
    background: var(--toast-bg); color: var(--toast-ink); font-size: 13px; transform: translate(-50%, -140%);
    display: none; white-space: nowrap; z-index: 5;
  }
  #toast {
    position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    max-width: calc(100% - 32px); text-align: center;
    background: var(--toast-bg); color: var(--toast-ink); padding: 10px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }

  #overlay {
    position: fixed; inset: 0; background: var(--scrim);
    display: none; align-items: center; justify-content: center; z-index: 10;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  #overlay.open { display: flex; }
  #overlay.side { background: transparent; pointer-events: none; justify-content: flex-end; }
  #overlay.side .panel { pointer-events: auto; width: min(400px, 100%); }
  .panel {
    width: min(580px, 100%); max-height: 92%; overflow: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
  }
  .panel h2 { margin: 0 0 4px; font-size: 20px; }
  .panel h3 { margin: 18px 0 8px; font-size: 15px; }
  .panel .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=text] {
    width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
    border-radius: 8px; background: var(--field); color: var(--ink);
  }
  .row input[type=text] { flex: 1; min-width: 0; width: auto; }
  button {
    font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:hover:not(:disabled) { filter: brightness(.95); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .close { float: right; }

  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .presets button { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; }
  .presets small { color: var(--muted); font-size: 12px; }
  .timer { min-height: 28px; font-size: 22px; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .list { display: grid; }
  .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .item .btns { display: flex; gap: 6px; }
  .item button { padding: 5px 10px; font-size: 13px; }
  .when { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .when.old { color: var(--warn); font-weight: 700; }
  .qty { margin-left: 6px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .qty.low { color: var(--warn); font-weight: 700; }
  .badge { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 12px; background: var(--warn-bg); color: var(--warn); }
  .badge.wait { background: var(--ok-bg); color: var(--ink); }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 14px; }
  .log { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .result small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .result { font-size: 26px; font-weight: 700; margin: 10px 0 14px; min-height: 38px; }

  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .note {
    font-family: "GoDing", "Apple SD Gothic Neo", sans-serif; font-size: 24px; line-height: 1.2;
    color: #2b2620; padding: 10px 10px 30px; border-radius: 3px; font-size: 14px; line-height: 1.4;
    box-shadow: 2px 3px 0 rgba(0, 0, 0, .15); position: relative; word-break: break-all; min-height: 72px;
  }
  .note button { position: absolute; right: 4px; bottom: 4px; padding: 1px 7px; font-size: 12px; background: rgba(255, 255, 255, .65); color: #2b2620; border-color: rgba(0, 0, 0, .15); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .steps span { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--line); color: var(--muted); }
  .steps span.on { background: var(--accent); color: var(--accent-ink); }
  .steps span.done { background: var(--ok-bg); color: var(--ink); }
  @media (max-width: 420px) { .panel { padding: 14px; } }
  @media (prefers-reduced-motion: reduce) { #toast, .bar i { transition: none; } }
</style>

<div id="stage"></div>
<div id="label"></div>
<div id="toast" role="status"></div>
<div id="hint">드래그: 방 돌려보기 · 휠/두 손가락: 확대·축소<br>냉장고, 싱크대, 창문, 에어컨, 정수기 등을 눌러 보세요</div>
<button id="fpsbtn">1인칭</button>
<div id="cross"></div>
<div id="dpad"><button data-k="w">앞</button><button data-k="a">좌</button><button data-k="s">뒤</button><button data-k="d">우</button></div>
<div id="ibar"></div>
<div id="hud"></div>
<div id="ramenhud"></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
